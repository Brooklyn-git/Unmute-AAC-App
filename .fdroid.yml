Name: Unmute
Summary: Offline symbol-based AAC communication app
Description: |
  Unmute turns a phone or tablet into a symbol-based communication board for
  people who cannot (or do not want to) speak. Tap cards to build sentences
  and let the device speak them aloud.

  Fully offline: no network, no accounts, nothing leaves the device.

  * Symbol grid boards with color-coded sections (Greetings, People, Feelings,
    Food & Drink, Actions, Places, Things, Body)
  * Sentence bar: tap cards or type, then speak
  * Customizable board: add, edit, reorder cards and sections; use symbols,
    emoji, or your own photos
  * English and Spanish, switchable at any time
  * Grid profiles (Big / Small / Custom) and card text size
  * Text-to-speech with selectable engine, rate, pitch, and audio output
    (speakers, wired, or Bluetooth)
  * Secure mode to lock editing
  * Import and export your data

Localized:
  es:
    Name: Unmute
    Summary: App de comunicación CAA sin conexión, basada en símbolos
    Description: |
      Unmute convierte un teléfono o tableta en un tablero de comunicación
      basado en símbolos para personas que no pueden (o no quieren) hablar.
      Toca tarjetas para formar frases y deja que el dispositivo las diga en
      voz alta.

      Totalmente sin conexión: sin red, sin cuentas, nada sale del dispositivo.

      * Tableros de símbolos con secciones por colores (Saludos, Personas,
        Sentimientos, Comida y bebida, Acciones, Lugares, Cosas, Cuerpo)
      * Barra de frases: toca tarjetas o escribe y luego habla
      * Tablero personalizable: añade, edita y reordena tarjetas y secciones;
        usa símbolos, emoji o tus propias fotos
      * Inglés y español, cambiables en cualquier momento
      * Perfiles de cuadrícula (Grande / Pequeña / Personalizada) y tamaño del
        texto de las tarjetas
      * Voz con motor, velocidad, tono y salida de audio seleccionables
        (altavoces, cable o Bluetooth)
      * Modo seguro para bloquear la edición
      * Importa y exporta tus datos
